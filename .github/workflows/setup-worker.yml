# Einmalige Einrichtung des Speicher-Servers (Cloudflare Worker + KV) — ohne lokalen Rechner.
#
# Start: GitHub → Actions → «Setup worker» → Run workflow.
# Benötigt die Repository-Secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   Token nach Vorlage «Edit Cloudflare Workers» (enthält Workers KV Storage · Edit)
#   CLOUDFLARE_ACCOUNT_ID  Account-ID aus dem Cloudflare-Dashboard
#
# Was passiert: KV-Namespace «o2-calcs» (ID in worker/wrangler.toml), Deploy des Workers «o2-api»,
# Gesundheitsprüfung, workers.dev-Adresse in js/config.js, Commit der geänderten Dateien.
# Wiederholbar: Vorhandenes wird erkannt und übersprungen.
name: Setup worker
on:
  workflow_dispatch:
    inputs:
      api_base:
        description: 'js/config.js: «auto» trägt die workers.dev-Adresse ein, «keep» lässt die Datei unverändert'
        type: choice
        default: auto
        options: [auto, keep]

permissions:
  contents: write

concurrency:
  group: setup-worker
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Voraussetzungen prüfen
        run: |
          ok=1
          [ -n "$CLOUDFLARE_API_TOKEN" ]  || { echo "::error::Secret CLOUDFLARE_API_TOKEN fehlt (Settings → Secrets and variables → Actions)"; ok=0; }
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "::error::Secret CLOUDFLARE_ACCOUNT_ID fehlt (Settings → Secrets and variables → Actions)"; ok=0; }
          [ "$ok" = 1 ]
      - name: Tests
        run: cd .. && node --test test/*.test.mjs
      - name: wrangler installieren
        run: npm install --no-audit --no-fund
      - name: Cloudflare-Zugang prüfen
        run: npx wrangler whoami
      - name: KV-Namespace «o2-calcs»
        id: kv
        run: |
          set +e
          list=$(npx wrangler kv namespace list 2>/dev/null)
          id=$(printf '%s' "$list" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const i=s.indexOf("[");const j=JSON.parse(s.slice(i));const d=j.find(x=>/(^|-)o2-calcs$/.test(x.title||""));process.stdout.write(d?d.id:"")}catch{process.stdout.write("")}})')
          if [ -z "$id" ]; then
            echo "Namespace wird angelegt …"
            out=$(npx wrangler kv namespace create o2-calcs 2>&1); echo "$out"
            id=$(printf '%s' "$out" | grep -oE '[0-9a-f]{32}' | head -1)
          else
            echo "Namespace vorhanden"
          fi
          set -e
          if [ -z "$id" ]; then
            echo "--- kv namespace list ---"; echo "$list"
            echo "::error::ID des KV-Namespace «o2-calcs» nicht ermittelbar. Häufigste Ursache: Dem API-Token fehlt «Account · Workers KV Storage · Edit»."
            exit 1
          fi
          sed -i -E "s/^id = \"[^\"]*\"/id = \"$id\"/" wrangler.toml
          echo "id = $id"
          echo "id=$id" >> "$GITHUB_OUTPUT"
      - name: Deploy
        id: deploy
        run: |
          set +e
          out=$(npx wrangler deploy 2>&1); rc=$?
          set -e
          echo "$out"
          [ "$rc" = 0 ] || { echo "::error::Deploy fehlgeschlagen – Ausgabe im Schritt prüfen"; exit 1; }
          url=$(echo "$out" | grep -oE 'https://[a-z0-9.-]+\.workers\.dev' | head -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Worker-Adresse: $url"
      - name: Gesundheitsprüfung
        run: |
          url='${{ steps.deploy.outputs.url }}'
          [ -n "$url" ] || { echo "::warning::workers.dev-Adresse nicht erkannt — Prüfung übersprungen"; exit 0; }
          sleep 5
          curl -sS --max-time 20 "$url/health" && echo
      - name: js/config.js auf workers.dev-Adresse setzen
        if: inputs.api_base == 'auto' && steps.deploy.outputs.url != ''
        run: |
          sed -i -E "s#apiBase: *'[^']*'#apiBase: '${{ steps.deploy.outputs.url }}'#" ../js/config.js
          cat ../js/config.js
      - name: Änderungen committen (wrangler.toml, js/config.js)
        run: |
          cd ..
          git config user.name  "o2-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/wrangler.toml js/config.js
          if git diff --cached --quiet; then echo "keine Änderung"; exit 0; fi
          git commit -m "Setup worker: KV-Namespace${{ inputs.api_base == 'auto' && ', apiBase' || '' }}"
          git pull --rebase
          git push
      - name: Zusammenfassung
        run: |
          {
            echo "## Speicher-Server eingerichtet"
            echo
            echo "* Worker-Adresse: ${{ steps.deploy.outputs.url }}"
            echo "* Prüfung: ${{ steps.deploy.outputs.url }}/health"
            echo "* KV-Namespace: ${{ steps.kv.outputs.id }}"
            echo
            echo "Nächster Schritt: https://o2.wicki.aero neu laden (GitHub Pages braucht nach dem Commit 1–2 Minuten)."
            echo "Nach der ersten Änderung zeigt die Zeile «Meine Berechnung» «gespeichert» statt «nur auf diesem Gerät»."
          } >> "$GITHUB_STEP_SUMMARY"
