# EDS O2-Planung — Cloudflare Worker (Speicher für «Meine Berechnung», KV)
# Einrichtung und Deploy ohne lokalen Rechner: Repository bwicki/briefing → Actions → «O2 worker»
# (dort liegen die Cloudflare-Zugangsdaten bereits; siehe SETUP.md). Hier stehen keine Geheimnisse.
name = "o2-api"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

[vars]
ALLOWED_ORIGINS = "https://o2.wicki.aero,https://bwicki.github.io,http://localhost:8080,http://127.0.0.1:8080"
APP_VERSION = "0.1.0"
KEEP_DAYS = "183"

[[kv_namespaces]]
binding = "CALCS"
id = "00000000000000000000000000000000"   # Platzhalter: der Workflow «O2 worker» setzt die ID beim Deploy ein
